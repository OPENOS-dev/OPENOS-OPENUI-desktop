name: OPENOS binpkg build

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      kernel:
        description: 内核分层 (仅 kernel 组件生效)
        type: choice
        default: base
        options: [base, base7, preview, classic]

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64]

    env:
      COMPONENT: OPENUI-desktop
      BINPKG_REPO: OPENOS-dev/OPENOS-BUILD-BINPKG
      KERNEL_TIER: ${{ inputs.kernel || 'base' }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖与交叉工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential ccache zstd meson ninja-build cmake pkg-config \
            libssl-dev zlib1g-dev liblz4-dev liblzma-dev libzstd-dev libbz2-dev \
            libgcrypt20-dev libcurl4-openssl-dev libdb-dev gettext gawk bison flex bc \
            libelf-dev libncurses-dev dwarves kmod cpio file libsodium-dev \
            automake autoconf libtool libarchive-dev libcap-dev libwlroots-dev \
            libblkid-dev uuid-dev libmount-dev libsmartcols-dev libfdisk-dev \
            qt6-base-dev qt6-declarative-dev qt6-wayland-dev qt6-svg-dev \
            ${{ matrix.arch == 'arm64' && 'crossbuild-essential-arm64' || '' }} \
            ${{ matrix.arch == 'arm32' && 'crossbuild-essential-armhf' || '' }} \
            ${{ matrix.arch == 'x86' && 'gcc-multilib' || '' }} \
            ${{ matrix.arch == 'loong64' && 'gcc-13-loongarch64-linux-gnu g++-13-loongarch64-linux-gnu' || '' }}
          # 验证 qt6-svg-dev 是否安装 (meson 依赖 Qt6Svg 模块)
          dpkg -l qt6-svg-dev &>/dev/null || {
            echo "::warning::qt6-svg-dev 未安装，尝试单独安装..."
            sudo apt-get install -y qt6-svg-dev
          }
          pkg-config --modversion Qt6Svg 2>/dev/null || echo "::warning::Qt6Svg.pc 未找到，meson 将使用 cmake 查找"
          ccache -M 4G
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: 构建并打包 binpkg
        run: |
          set -euo pipefail
          # 全程输出写入日志文件 (供失败上报 step 读取)
          exec > >(tee "$RUNNER_TEMP/build.log") 2>&1
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in
            x86-64) TARGET=x86_64-openos-linux-gnu; CROSS="" ;;
            x86)    TARGET=i686-openos-linux-gnu;     CROSS="" ;;
            arm64)  TARGET=aarch64-openos-linux-gnu;  CROSS=aarch64-linux-gnu- ;;
            arm32)  TARGET=armv7h-openos-linux-gnueabihf; CROSS=arm-linux-gnueabihf- ;;
            loong64)TARGET=loongarch64-openos-linux-gnu; CROSS=loongarch64-linux-gnu- ;;
          esac
          export TARGET CROSS
          WORK="$RUNNER_TEMP/${COMPONENT}-${ARCH}-build"
          rm -rf "$WORK"; mkdir -p "$WORK"
          PKG="$WORK/${COMPONENT}-${ARCH}-DEV2026.1.pkg.tar.zst"
          meson setup "$WORK/build" --prefix=/usr -Dbuildtype=release
          meson compile -C "$WORK/build"
          DESTDIR="$WORK/pkg" meson install -C "$WORK/build"
          # 打包
          mkdir -p "$WORK/pkg"
          tar --zstd -cf "$PKG" -C "$WORK/pkg" .
          ls -la "$PKG"

      - name: 推送 binpkg 到共享仓库
        env:
          BINPKG_TOKEN: ${{ secrets.OPENOS_BINPKG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BINPKG_TOKEN" ]; then
            echo "::warning::未配置 secrets.OPENOS_BINPKG_TOKEN，跳过推送"
            exit 0
          fi
          ARCH="${{ matrix.arch }}"
          # 重新定义 WORK/PKG (step 间 shell 不共享变量)
          WORK="$RUNNER_TEMP/${COMPONENT}-${ARCH}-build"
          PKG="$WORK/${COMPONENT}-${ARCH}-DEV2026.1.pkg.tar.zst"
          rm -rf /tmp/binpkg-repo
          git clone --depth 1 "https://x-access-token:${BINPKG_TOKEN}@github.com/${BINPKG_REPO}.git" /tmp/binpkg-repo
          cd /tmp/binpkg-repo
          mkdir -p "bins/${COMPONENT}/${ARCH}"
          cp -f "$PKG" "bins/${COMPONENT}/${ARCH}/"
          # 构建成功: 删除对应的失败日志, 避免 failure-report 重复创建 Issue
          rm -f "logs/${COMPONENT}/$ARCH.log"
          git config user.name "OPENOS CI"
          git config user.email "ci@openos.dev"
          git add -A
          git commit -m "binpkg: ${COMPONENT} ${ARCH} (${GITHUB_SHA:0:8})" || echo "no changes"
          git push -q origin main

      - name: 上报失败原因到共享仓库
        if: failure()
        env:
          BINPKG_TOKEN: ${{ secrets.OPENOS_BINPKG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$BINPKG_TOKEN" ]; then
            echo "::warning::未配置 OPENOS_BINPKG_TOKEN，跳过失败上报"
            exit 0
          fi
          ARCH="${{ matrix.arch }}"
          {
            echo "# ${COMPONENT} 构建失败 (${ARCH})"
            echo
            echo "- 仓库: ${{ github.repository }}"
            echo "- 运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- 提交: ${{ github.sha }}"
            echo "- 时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## 构建日志尾部"
            echo '```'
            tail -80 "$RUNNER_TEMP/build.log" 2>/dev/null || echo "(未捕获到日志)"
            echo '```'
          } > "$RUNNER_TEMP/fail.txt"
          git clone --depth 1 "https://x-access-token:${BINPKG_TOKEN}@github.com/${BINPKG_REPO}.git" /tmp/binpkg-repo
          cd /tmp/binpkg-repo
          mkdir -p "logs/${COMPONENT}"
          rm -f "logs/${COMPONENT}/$ARCH.log"
          cp "$RUNNER_TEMP/fail.txt" "logs/${COMPONENT}/$ARCH.log"
          git config user.name "OPENOS CI"
          git config user.email "ci@openos.dev"
          git add -A
          git commit -m "fail-log: ${COMPONENT}/${ARCH} (${GITHUB_SHA:0:8})" || echo "no changes"
          git push -q origin main
